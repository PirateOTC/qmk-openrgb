name: Build Drop CTRL OpenRGB
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # We use the official QMK container to avoid environment errors
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout QMK (Version 0.26.11)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.26.11
          submodules: recursive

      - name: Build Firmware
        run: |
          # Disable git safety checks which often break container builds
          git config --global --add safe.directory /__w/your-repo-name/your-repo-name
          
          # The official way to compile for the V1 CTRL
          qmk compile -kb massdrop/ctrl -km openrgb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop-CTRL-OpenRGB
          path: .build/*.bin
