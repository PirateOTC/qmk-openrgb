name: Build Drop CTRL Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4
        with:
          path: my-config

      - name: Checkout QMK (Version 0.26.11)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.26.11
          submodules: recursive
          path: qmk_firmware

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pip
          # Install QMK globally so the PATH is easier to find
          sudo python3 -m pip install qmk

      - name: Setup and Build
        run: |
          # Add the common pip install locations to PATH just in case
          export PATH=$PATH:/home/runner/.local/bin
          
          cd qmk_firmware
          mkdir -p keyboards/massdrop/ctrl/keymaps/mine
          
          # Copy your files
          find ../my-config -name "keymap.c" -exec cp {} keyboards/massdrop/ctrl/keymaps/mine/ \;
          find ../my-config -name "config.h" -exec cp {} keyboards/massdrop/ctrl/keymaps/mine/ \;
          find ../my-config -name "rules.mk" -exec cp {} keyboards/massdrop/ctrl/keymaps/mine/ \;
          
          # Use the 'qmk' command directly instead of 'python3 -m'
          qmk compile -kb massdrop/ctrl -km mine

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop-CTRL-Firmware
          path: qmk_firmware/.build/*.bin
