name: Build Drop CTRL Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4
        with:
          path: my-config

      - name: Checkout QMK (Version 0.26.11)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.26.11
          submodules: recursive
          path: qmk_firmware

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pip
          python3 -m pip install qmk

      - name: Setup and Build
        run: |
          cd qmk_firmware
          # Create the folder and copy ONLY your custom files
          mkdir -p keyboards/massdrop/ctrl/keymaps/mine
          cp ../my-config/keymap.c keyboards/massdrop/ctrl/keymaps/mine/ || true
          cp ../my-config/config.h keyboards/massdrop/ctrl/keymaps/mine/ || true
          cp ../my-config/rules.mk keyboards/massdrop/ctrl/keymaps/mine/ || true
          
          # Compile using the local qmk command
          python3 -m qmk.cli compile -kb massdrop/ctrl -km mine

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop-CTRL-Firmware
          path: qmk_firmware/.build/*.bin
