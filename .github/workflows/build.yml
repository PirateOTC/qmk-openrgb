name: Build Drop CTRL OpenRGB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-arm-none-eabi \
            avr-libc \
            avrdude \
            dfu-util \
            dfu-programmer \
            clang \
            python3-dev

      - name: Install QMK CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install qmk

      - name: Set QMK home
        run: |
          echo "QMK_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build firmware
        run: |
          qmk compile -kb massdrop/ctrl -km openrgb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: massdrop-ctrl-openrgb
          path: |
            *.hex
            *.bin
