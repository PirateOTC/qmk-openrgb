name: Build Drop CTRL Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # Using a specific older version to avoid Python 3.14 subparser errors
    container: ghcr.io/qmk/qmk_cli:0.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        run: |
          # We skip 'qmk setup' because the container is already ready
          qmk compile -kb massdrop/ctrl -km default

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop-CTRL-Firmware
          path: |
            *.bin
            .build/*.bin
          if-no-files-found: error
