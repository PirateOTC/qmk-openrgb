name: Build Drop CTRL Firmware
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4
        with:
          path: my-config

      - name: Checkout QMK (Version 0.26.11)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.26.11
          submodules: recursive
          path: qmk_firmware

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pip python3-setuptools
          python3 -m pip install --upgrade pip
          python3 -m pip install qmk

      - name: Setup and Build
        run: |
          cd qmk_firmware
          mkdir -p keyboards/massdrop/ctrl/keymaps/mine
          
          # Search for keymap.c in your repo and copy it to the build folder
          find ../my-config -name "keymap.c" -exec cp {} keyboards/massdrop/ctrl/keymaps/mine/ \;
          find ../my-config -name "config.h" -exec cp {} keyboards/massdrop/ctrl/keymaps/mine/ \;
          find ../my-config -name "rules.mk" -exec cp {} keyboards/massdrop/ctrl/keymaps/mine/ \;
          
          # Force python to see the installed qmk module
          export PYTHONPATH=$PYTHONPATH:/home/runner/.local/lib/python3.10/site-packages
          python3 -m qmk.cli compile -kb massdrop/ctrl -km mine

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop-CTRL-Firmware
          path: qmk_firmware/.build/*.bin
