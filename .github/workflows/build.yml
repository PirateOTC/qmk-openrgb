name: Build Drop CTRL OpenRGB
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout QMK (Version 0.26.11)
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 0.26.11
          submodules: recursive
          path: qmk_root

      - name: Build Firmware
        run: |
          # 1. Tell QMK exactly where the source code is
          export QMK_HOME=$(pwd)/qmk_root
          
          # 2. Fix git permissions for the container
          git config --global --add safe.directory $(pwd)/qmk_root
          
          # 3. Run the compile using the absolute path to the local QMK module
          # This avoids using the global CLI which is causing the validation error
          python3 -m qmk.cli compile -kb massdrop/ctrl -km openrgb
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drop-CTRL-OpenRGB
          path: qmk_root/.build/*.bin
